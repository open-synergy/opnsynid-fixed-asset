scenarios:
  - name: "Useful Life Change With Operating Unit - Create"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset"
        values:
          name: "ULCOU Asset Account"
          code: "TULCOU1_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr"
        values:
          name: "ULCOU Accum Depr"
          code: "TULCOU1_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense"
        values:
          name: "ULCOU Depr Expense"
          code: "TULCOU1_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category"
        values:
          name: "Test Category ULCOU"
          code: "TULCOU1_C1"
          journal_id: "EVAL: registry['journal'].id"
          account_asset_id: "EVAL: registry['account_asset'].id"
          account_depreciation_id: "EVAL: registry['account_depr'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Create asset"
        action: "create"
        model: "fixed.asset.asset"
        save_as: "asset"
        as_user: "base.user_admin"
        values:
          name: "Test Asset ULCOU"
          category_id: "EVAL: registry['category'].id"
          purchase_value: 5000000.0
          salvage_value: 0.0
          date_start: 2024-01-01
          type: "normal"
          method: "linear"
          method_time: "year"
          method_number: 4
          method_period: "month"
          prorata: true

      - step: "Confirm asset"
        action: "call"
        target: "asset"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Approve asset"
        action: "call"
        target: "asset"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Create useful life change"
        action: "create"
        model: "fixed_asset_useful_life_estimation_change"
        save_as: "ulc"
        as_user: "base.user_admin"
        values:
          asset_id: "EVAL: registry['asset'].id"
          date: 2024-07-01
          method_number: 6
          method_period: "month"
          previous_method_number: 4
          previous_method_period: "month"

      - step: "Assert ULC created"
        action: "assert"
        target: "ulc"
        asserts:
          state:
            type: "value"
            expected: "draft"
