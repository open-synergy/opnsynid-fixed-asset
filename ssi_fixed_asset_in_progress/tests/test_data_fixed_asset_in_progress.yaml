scenarios:
  - name: "Fixed Asset In Progress - Draft to Open Workflow"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset"
        values:
          name: "InProgress Asset Account"
          code: "TINP1_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr"
        values:
          name: "InProgress Accum Depr"
          code: "TINP1_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense"
        values:
          name: "InProgress Depr Expense"
          code: "TINP1_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create in-progress account"
        action: "create"
        model: "account.account"
        save_as: "account_in_progress"
        values:
          name: "InProgress Account"
          code: "TINP1_A04"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category"
        values:
          name: "Test Category InProgress"
          code: "TINP1_C1"
          journal_id: "EVAL: registry['journal'].id"
          account_asset_id: "EVAL: registry['account_asset'].id"
          account_depreciation_id: "EVAL: registry['account_depr'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Create in-progress record"
        action: "create"
        model: "fixed_asset.in_progress"
        save_as: "in_progress"
        as_user: "base.user_admin"
        values:
          title: "Test In Progress Asset"
          category_id: "EVAL: registry['category'].id"
          date_start: 2024-01-01
          date_end: 2024-06-30
          journal_id: "EVAL: registry['journal'].id"
          fixed_asset_account_id: "EVAL: registry['account_asset'].id"
          fixed_asset_in_progress_account_id: "EVAL: registry['account_in_progress'].id"

      - step: "Assert in-progress in draft"
        action: "assert"
        target: "in_progress"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm in-progress"
        action: "call"
        target: "in_progress"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "in_progress"
        method: "invalidate_cache"

      - step: "Assert in-progress confirmed"
        action: "assert"
        target: "in_progress"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve in-progress"
        action: "call"
        target: "in_progress"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "in_progress"
        method: "invalidate_cache"

      - step: "Assert in-progress open"
        action: "assert"
        target: "in_progress"
        asserts:
          state:
            type: "value"
            expected: "open"
