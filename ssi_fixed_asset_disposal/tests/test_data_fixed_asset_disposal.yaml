scenarios:
  - name: "Fixed Asset Disposal Type - Create"
    steps:
      - step: "Create disposal type"
        action: "create"
        model: "fixed_asset.disposal_type"
        save_as: "disposal_type"
        values:
          name: "Test Disposal Type"
          code: "TDIST1"

      - step: "Assert disposal type created"
        action: "assert"
        target: "disposal_type"
        asserts:
          name:
            type: "value"
            expected: "Test Disposal Type"

  - name: "Fixed Asset Disposal - Full Workflow"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset"
        values:
          name: "Disposal Asset Account"
          code: "TDIS2_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr"
        values:
          name: "Disposal Accum Depr"
          code: "TDIS2_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense"
        values:
          name: "Disposal Depr Expense"
          code: "TDIS2_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create exchange account"
        action: "create"
        model: "account.account"
        save_as: "account_exchange"
        values:
          name: "Disposal Exchange Account"
          code: "TDIS2_A04"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create gain account"
        action: "create"
        model: "account.account"
        save_as: "account_gain"
        values:
          name: "Disposal Gain Account"
          code: "TDIS2_A05"
          user_type_id: "REF: account.data_account_type_other_income"
          internal_type: "other"

      - step: "Create loss account"
        action: "create"
        model: "account.account"
        save_as: "account_loss"
        values:
          name: "Disposal Loss Account"
          code: "TDIS2_A06"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category"
        values:
          name: "Test Category Disposal"
          code: "TDIS2_C1"
          journal_id: "EVAL: registry['journal'].id"
          account_asset_id: "EVAL: registry['account_asset'].id"
          account_depreciation_id: "EVAL: registry['account_depr'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Create asset"
        action: "create"
        model: "fixed.asset.asset"
        save_as: "asset"
        as_user: "base.user_admin"
        values:
          name: "Test Asset Disposal"
          category_id: "EVAL: registry['category'].id"
          purchase_value: 10000000.0
          salvage_value: 0.0
          date_start: 2024-01-01
          type: "normal"
          method: "linear"
          method_time: "year"
          method_number: 4
          method_period: "month"
          prorata: true

      - step: "Confirm asset"
        action: "call"
        target: "asset"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Approve asset"
        action: "call"
        target: "asset"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Assert asset open"
        action: "assert"
        target: "asset"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create disposal type"
        action: "create"
        model: "fixed_asset.disposal_type"
        save_as: "disposal_type"
        values:
          name: "Test Disposal Type S2"
          code: "TDIS2_T1"

      - step: "Create disposal"
        action: "create"
        model: "fixed_asset.disposal"
        save_as: "disposal"
        as_user: "base.user_admin"
        values:
          date_disposition: 2024-06-30
          asset_id: "EVAL: registry['asset'].id"
          type_id: "EVAL: registry['disposal_type'].id"
          disposition_price: 0.0
          acquisition_price: 10000000.0
          disposal_journal_id: "EVAL: registry['journal'].id"
          asset_account_id: "EVAL: registry['account_asset'].id"
          exchange_account_id: "EVAL: registry['account_exchange'].id"
          gain_account_id: "EVAL: registry['account_gain'].id"
          loss_account_id: "EVAL: registry['account_loss'].id"
          accumulated_depreciation_account_id: "EVAL: registry['account_depr'].id"
          generate_accounting_entry: false

      - step: "Assert disposal in draft"
        action: "assert"
        target: "disposal"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm disposal"
        action: "call"
        target: "disposal"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "disposal"
        method: "invalidate_cache"

      - step: "Assert disposal confirmed"
        action: "assert"
        target: "disposal"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve disposal"
        action: "call"
        target: "disposal"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "disposal"
        method: "invalidate_cache"

      - step: "Assert disposal open"
        action: "assert"
        target: "disposal"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Complete disposal"
        action: "call"
        target: "disposal"
        method: "action_done"
        as_user: "base.user_admin"

      - step: "Invalidate cache after done"
        action: "call"
        target: "disposal"
        method: "invalidate_cache"

      - step: "Assert disposal done"
        action: "assert"
        target: "disposal"
        asserts:
          state:
            type: "value"
            expected: "done"
