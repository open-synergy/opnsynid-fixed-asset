scenarios:
  - name: "Salvage Value Change With Documenso - Create"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset"
        values:
          name: "SALDOC Asset Account"
          code: "TSALDOC1_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr"
        values:
          name: "SALDOC Accum Depr"
          code: "TSALDOC1_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense"
        values:
          name: "SALDOC Depr Expense"
          code: "TSALDOC1_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category"
        values:
          name: "Test Category SALDOC"
          code: "TSALDOC1_C1"
          journal_id: "EVAL: registry['journal'].id"
          account_asset_id: "EVAL: registry['account_asset'].id"
          account_depreciation_id: "EVAL: registry['account_depr'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Create asset"
        action: "create"
        model: "fixed.asset.asset"
        save_as: "asset"
        as_user: "base.user_admin"
        values:
          name: "Test Asset SALDOC"
          category_id: "EVAL: registry['category'].id"
          purchase_value: 5000000.0
          salvage_value: 500000.0
          date_start: 2024-01-01
          type: "normal"
          method: "linear"
          method_time: "year"
          method_number: 4
          method_period: "month"
          prorata: true

      - step: "Confirm asset"
        action: "call"
        target: "asset"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Approve asset"
        action: "call"
        target: "asset"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Create salvage value change"
        action: "create"
        model: "fixed_asset_salvage_value_estimation_change"
        save_as: "salvage_change"
        as_user: "base.user_admin"
        values:
          asset_id: "EVAL: registry['asset'].id"
          date: 2024-06-01
          salvage_value: 1000000.0
          prev_salvage_value: 500000.0

      - step: "Assert salvage change created"
        action: "assert"
        target: "salvage_change"
        asserts:
          state:
            type: "value"
            expected: "draft"
