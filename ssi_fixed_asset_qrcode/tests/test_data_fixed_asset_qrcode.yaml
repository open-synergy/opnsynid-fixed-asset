scenarios:
  - name: "Fixed Asset With QR Code - Create"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset"
        values:
          name: "QR Asset Account"
          code: "TQR1_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr"
        values:
          name: "QR Accum Depr"
          code: "TQR1_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense"
        values:
          name: "QR Depr Expense"
          code: "TQR1_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category"
        values:
          name: "Test Category QR"
          code: "TQR1_C1"
          journal_id: "EVAL: registry['journal'].id"
          account_asset_id: "EVAL: registry['account_asset'].id"
          account_depreciation_id: "EVAL: registry['account_depr'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Create asset with QR code mixin"
        action: "create"
        model: "fixed.asset.asset"
        save_as: "asset"
        as_user: "base.user_admin"
        values:
          name: "Test Asset QR"
          category_id: "EVAL: registry['category'].id"
          purchase_value: 5000000.0
          salvage_value: 0.0
          date_start: 2024-01-01
          type: "normal"
          method: "linear"
          method_time: "year"
          method_number: 4
          method_period: "month"
          prorata: true

      - step: "Assert asset created"
        action: "assert"
        target: "asset"
        asserts:
          name:
            type: "value"
            expected: "Test Asset QR"
