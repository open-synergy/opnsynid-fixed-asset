scenarios:
  - name: "Fixed Asset Category - Create"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset"
        values:
          name: "Test Asset Account S1"
          code: "TFA1_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr"
        values:
          name: "Test Accum Depr S1"
          code: "TFA1_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense"
        values:
          name: "Test Depr Expense S1"
          code: "TFA1_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category"
        values:
          name: "Test Category S1"
          code: "TFA1_C1"
          journal_id: "EVAL: registry['journal'].id"
          account_asset_id: "EVAL: registry['account_asset'].id"
          account_depreciation_id: "EVAL: registry['account_depr'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Assert category created"
        action: "assert"
        target: "category"
        asserts:
          name:
            type: "value"
            expected: "Test Category S1"

  - name: "Fixed Asset - Draft to Open Workflow"
    steps:
      - step: "Search general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal2"
        limit: 1
        order: "id asc"

      - step: "Create asset account"
        action: "create"
        model: "account.account"
        save_as: "account_asset2"
        values:
          name: "Test Asset Account S2"
          code: "TFA2_A01"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create depreciation account"
        action: "create"
        model: "account.account"
        save_as: "account_depr2"
        values:
          name: "Test Accum Depr S2"
          code: "TFA2_A02"
          user_type_id: "REF: account.data_account_type_non_current_assets"
          internal_type: "other"

      - step: "Create expense account"
        action: "create"
        model: "account.account"
        save_as: "account_expense2"
        values:
          name: "Test Depr Expense S2"
          code: "TFA2_A03"
          user_type_id: "REF: account.data_account_type_expenses"
          internal_type: "other"

      - step: "Create category"
        action: "create"
        model: "fixed.asset.category"
        save_as: "category2"
        values:
          name: "Test Category S2"
          code: "TFA2_C1"
          journal_id: "EVAL: registry['journal2'].id"
          account_asset_id: "EVAL: registry['account_asset2'].id"
          account_depreciation_id: "EVAL: registry['account_depr2'].id"
          account_expense_depreciation_id: "EVAL: registry['account_expense2'].id"
          method_time: "year"
          method_number: 4
          method_period: "month"
          method: "linear"
          prorata: true

      - step: "Create asset"
        action: "create"
        model: "fixed.asset.asset"
        save_as: "asset"
        as_user: "base.user_admin"
        values:
          name: "Test Asset S2"
          category_id: "EVAL: registry['category2'].id"
          purchase_value: 10000000.0
          salvage_value: 0.0
          date_start: 2024-01-01
          type: "normal"
          method: "linear"
          method_time: "year"
          method_number: 4
          method_period: "month"
          prorata: true

      - step: "Assert asset in draft state"
        action: "assert"
        target: "asset"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm asset"
        action: "call"
        target: "asset"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Assert asset confirmed"
        action: "assert"
        target: "asset"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve asset"
        action: "call"
        target: "asset"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "asset"
        method: "invalidate_cache"

      - step: "Assert asset open"
        action: "assert"
        target: "asset"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Compute depreciation board"
        action: "call"
        target: "asset"
        method: "compute_depreciation_board"
        as_user: "base.user_admin"
